[package]
name = "markdown-viewer"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Render a Markdown file with GitHub styling and live-reload it in your browser"
license = "MIT"
repository = "https://github.com/mdellavo/markdown-viewer"
readme = "README.md"
keywords = ["markdown", "preview", "github", "live-reload", "viewer"]
categories = ["command-line-utilities", "text-processing"]
exclude = ["/.github", "/packaging", "/tests"]

[dependencies]
anyhow = "1.0.105"
axum = "0.8.9"
clap = { version = "4.6.10", features = ["derive"] }
comrak = { version = "1.2.0", default-features = false, features = ["shortcodes", "syntect-fancy"] }
flate2 = "1.1.11"
mime_guess = "2.0.5"
notify-debouncer-full = "0.8.0"
opener = "0.9.0"
percent-encoding = "2.3.2"
serde_json = "1.0.154"
syntect = { version = "5.3.0", default-features = false, features = ["html", "default-themes", "default-syntaxes", "regex-fancy"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "net", "signal", "fs", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
