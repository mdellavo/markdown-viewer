[package]
name = "markdown-viewer-rs"
version = "0.15.0"
edition = "2024"
rust-version = "1.91"
description = "Render a Markdown file with GitHub styling and live-reload it in your browser"
license = "MIT"
repository = "https://github.com/mdellavo/markdown-viewer"
readme = "README.md"
keywords = ["markdown", "preview", "github", "live-reload", "viewer"]
categories = ["command-line-utilities", "text-processing"]
exclude = ["/.github", "/packaging", "/tests", "/docs"]

# The crate is markdown-viewer-rs on crates.io (markdown-viewer was taken);
# the command it installs is markdown-viewer.
[[bin]]
name = "markdown-viewer"
path = "src/main.rs"

# Linux packages, built by the release workflow (cargo-deb, cargo-generate-rpm).
[package.metadata.deb]
name = "markdown-viewer"
maintainer = "Marc DellaVolpe"
section = "text"
extended-description = "Renders Markdown with GitHub styling (including Mermaid diagrams and math) and shows it in your browser, live-reloading as you edit."
assets = [
    ["target/release/markdown-viewer", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/markdown-viewer/", "644"],
    ["CHANGELOG.md", "usr/share/doc/markdown-viewer/", "644"],
    ["completions/markdown-viewer.bash", "usr/share/bash-completion/completions/markdown-viewer", "644"],
    ["completions/_markdown-viewer", "usr/share/zsh/vendor-completions/", "644"],
    ["completions/markdown-viewer.fish", "usr/share/fish/vendor_completions.d/", "644"],
    ["man/markdown-viewer.1", "usr/share/man/man1/", "644"],
    ["packaging/linux/markdown-viewer.desktop", "usr/share/applications/", "644"],
    ["assets/macos/AppIcon.svg", "usr/share/icons/hicolor/scalable/apps/markdown-viewer.svg", "644"],
]

[package.metadata.generate-rpm]
name = "markdown-viewer"
assets = [
    { source = "target/release/markdown-viewer", dest = "/usr/bin/markdown-viewer", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/markdown-viewer/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/markdown-viewer/LICENSE", mode = "644" },
    { source = "completions/markdown-viewer.bash", dest = "/usr/share/bash-completion/completions/markdown-viewer", mode = "644" },
    { source = "completions/_markdown-viewer", dest = "/usr/share/zsh/site-functions/_markdown-viewer", mode = "644" },
    { source = "completions/markdown-viewer.fish", dest = "/usr/share/fish/vendor_completions.d/markdown-viewer.fish", mode = "644" },
    { source = "man/markdown-viewer.1", dest = "/usr/share/man/man1/markdown-viewer.1", mode = "644" },
    { source = "packaging/linux/markdown-viewer.desktop", dest = "/usr/share/applications/markdown-viewer.desktop", mode = "644" },
    { source = "assets/macos/AppIcon.svg", dest = "/usr/share/icons/hicolor/scalable/apps/markdown-viewer.svg", mode = "644" },
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/markdown-viewer-{ target }.tar.gz"
bin-dir = "markdown-viewer-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

# Windows releases are zip files.
[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/markdown-viewer-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/markdown-viewer-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
anyhow = "1.0.105"
axum = "0.8.9"
clap = { version = "4.6.10", features = ["derive"] }
clap_complete = "4.6.12"
clap_mangen = "0.3.4"
comrak = { version = "1.2.0", default-features = false, features = ["shortcodes", "syntect-fancy"] }
dunce = "1.0.5"
flate2 = "1.1.11"
mime_guess = "2.0.5"
notify-debouncer-full = "0.8.0"
opener = "0.9.0"
percent-encoding = "2.3.2"
pikchr = "0.1"
qrcode = { version = "0.15", default-features = false, features = ["svg"] }
roxmltree = "0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
svgbob = "0.7"
syntect = { version = "5.3.0", default-features = false, features = ["html", "default-themes", "default-syntaxes", "regex-fancy"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "net", "signal", "fs", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
toml = "1.2.3"
toml_edit = "0.25.21"
url = "2.5.9"
yaml-rust2 = "0.13.2"

[dev-dependencies]
headless_chrome = "1.0.22"
insta = "1.49.0"
serde_json = "1.0.154"
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
