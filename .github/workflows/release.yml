name: Release

# Push a tag like v0.4.0 to build binaries and Linux packages, publish a
# GitHub release, update the Homebrew formula in mdellavo/homebrew-tap, and
# publish the crate to crates.io and the AUR package markdown-viewer-bin.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  TAP_REPO: mdellavo/homebrew-tap

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check tag matches Cargo.toml version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: packaging/package.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Extract changelog section
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found=1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "Release $GITHUB_REF_NAME" > notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # HOMEBREW_TAP_DEPLOY_KEY is the private half of a deploy key with
      # write access to the tap repository only.
      - name: Update formula in tap
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::warning::HOMEBREW_TAP_DEPLOY_KEY not set; skipping tap update"
            exit 0
          fi
          key="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          packaging/homebrew/formula.sh "${GITHUB_REF_NAME#v}" dist > markdown-viewer.rb
          git clone "git@github.com:${TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cp markdown-viewer.rb tap/Formula/markdown-viewer.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/markdown-viewer.rb
          git commit -m "markdown-viewer ${GITHUB_REF_NAME}"
          git push
          rm -f "$key"

  crates-io:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # CARGO_REGISTRY_TOKEN: a crates.io API token with publish rights.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN not set; skipping crates.io"
            exit 0
          fi
          cargo publish --locked

  aur:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate and test the AUR package
        env:
          AUR_MAINTAINER: ${{ vars.AUR_MAINTAINER }}
        run: |
          packaging/aur/pkgbuild.sh "${GITHUB_REF_NAME#v}" dist aur
          docker run --rm -v "$PWD/aur:/pkg:ro" -v "$PWD/packaging/aur/test.sh:/test.sh:ro" \
            archlinux:latest bash /test.sh /pkg
      # AUR_SSH_PRIVATE_KEY: the private half of an SSH key added to the
      # AUR account that maintains markdown-viewer-bin.
      - name: Publish to the AUR
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_KEY" ]; then
            echo "::warning::AUR_SSH_PRIVATE_KEY not set; skipping the AUR"
            exit 0
          fi
          key="$RUNNER_TEMP/aur_key"
          printf '%s\n' "$AUR_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          # Cloning a package that doesn't exist yet gives an empty repository;
          # the first push creates it.
          git clone ssh://aur@aur.archlinux.org/markdown-viewer-bin.git aur-repo
          cp aur/PKGBUILD aur/.SRCINFO aur-repo/
          cd aur-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to ${GITHUB_REF_NAME#v}"
          git push origin HEAD:master
          rm -f "$key"
