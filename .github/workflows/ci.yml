name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Git Bash on Windows, so the same scripts run everywhere.
defaults:
  run:
    shell: bash

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Every runner has Chrome; fail rather than skip the browser tests.
      MARKDOWN_VIEWER_BROWSER_TESTS: required
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: VS Code extension tests
        run: node editors/vscode/test/extension.test.js

  # The same builds and packages as a release, so problems (a retired
  # runner image, a broken package) show up before tagging.
  release-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: packaging/package.sh ${{ matrix.target }}
        if: runner.os != 'Windows'
      - run: pwsh packaging/package.ps1 ${{ matrix.target }}
        if: runner.os == 'Windows'
      - name: Unzip and run the Windows build
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          cd dist
          unzip -q markdown-viewer-x86_64-pc-windows-msvc.zip
          cd markdown-viewer-x86_64-pc-windows-msvc
          ./markdown-viewer.exe --version
          printf '# Hello\n' | ./markdown-viewer.exe - -o - | grep -q '<h1'
          test -f completions/_markdown-viewer.ps1
      - name: Install the .deb and run it
        if: runner.os == 'Linux'
        run: |
          sudo dpkg -i dist/markdown-viewer_*.deb
          markdown-viewer --version
          test -f /usr/share/man/man1/markdown-viewer.1.gz
          test -f /usr/share/bash-completion/completions/markdown-viewer
          test -f /usr/share/applications/markdown-viewer.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/markdown-viewer.svg
          printf '# Hello\n' | markdown-viewer - -o - | grep -q '<h1'
      - name: Check the Homebrew formula generator
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          mkdir -p fake
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            echo "0000  markdown-viewer-$t.tar.gz" > fake/markdown-viewer-$t.tar.gz.sha256
          done
          packaging/homebrew/formula.sh 0.0.0 fake > formula.rb
          ruby -c formula.rb
          for t in x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            echo "0000  markdown-viewer-$t.zip" > fake/markdown-viewer-$t.zip.sha256
          done
          packaging/scoop/manifest.sh 0.0.0 fake > markdown-viewer.json
          python3 -c "import json; m = json.load(open('markdown-viewer.json')); assert m['bin'] == 'markdown-viewer.exe'"

  # The AUR package for the latest release, built and installed on Arch.
  aur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate and test the AUR package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --json tagName --jq .tagName)
          gh release download "$tag" --pattern '*linux-gnu.tar.gz.sha256' --dir dist
          packaging/aur/pkgbuild.sh "${tag#v}" dist aur
          docker run --rm -v "$PWD/aur:/pkg:ro" -v "$PWD/packaging/aur/test.sh:/test.sh:ro" \
            archlinux:latest bash /test.sh /pkg
